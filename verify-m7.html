<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>التحقق من شهادة | أكاديمية اجتاز</title><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><style>
:root{--primary:#4f55e8;--accent:#7257e8}*{box-sizing:border-box}body{font-family:Tajawal,Cairo,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(145deg,#f3f6ff,#fdfdff);color:#1c3769;margin:0;min-height:100dvh}header{padding:22px max(5vw,18px);display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:#4355b8;text-decoration:none;font-weight:800}.brand{font-size:19px;font-weight:950}main{width:min(690px,calc(100% - 30px));margin:30px auto 70px}.card{background:white;border:1px solid #e2e7f9;box-shadow:0 20px 65px rgba(21,44,117,.09);border-radius:28px;padding:29px}h1{font-size:clamp(27px,5vw,40px);margin:6px 0 12px}p{color:#65789c;line-height:2}form{display:flex;gap:9px;margin:24px 0}input{width:100%;border:1px solid #d7e2f6;border-radius:14px;padding:13px 15px;font:inherit;font-weight:700;direction:ltr;text-align:left;text-transform:uppercase}button{background:linear-gradient(125deg,var(--primary),var(--accent));border:0;padding:12px 24px;border-radius:14px;color:white;font:inherit;font-weight:850;cursor:pointer;white-space:nowrap}.status{padding:15px;border-radius:14px;background:#f5f7ff;line-height:1.8;margin:18px 0}.status.ok{background:#effbf5;color:#176947}.status.bad{background:#fff1f2;color:#9a3350}.info{display:grid;gap:12px;border-top:1px solid #edf1f9;margin-top:20px;padding-top:20px}.info div{display:flex;justify-content:space-between;align-items:start;gap:12px}.info span{color:#667a9d}.info strong{max-width:64%;overflow-wrap:anywhere;text-align:left}.badge{display:inline-flex;color:var(--primary);font-weight:950;background:#eeeefe;padding:7px 12px;border-radius:100px;margin-bottom:5px}small{color:#8190a9}footer{text-align:center;color:#8292ae;font-size:12px;padding:20px}@media(max-width:500px){.card{padding:19px}form{flex-direction:column}button{min-height:47px}.info div{flex-direction:column;gap:2px}.info strong{max-width:none;text-align:right}}
</style></head><body><header><div class="brand">🎓 أكاديمية اجتاز</div><a href="./index.html">العودة للأكاديمية ↗</a></header><main><section class="card"><span class="badge">نظام الشهادات المعتمدة</span><h1>التحقق من صحة شهادة</h1><p>أدخل رمز التحقق الموجود أسفل الشهادة. بيانات التحقق العامة لا تكشف أرقام الهواتف أو المعلومات الشخصية للطلاب.</p><form id="check"><input name="code" aria-label="رمز الشهادة" inputmode="latin" pattern="[A-Fa-f0-9]{24}" maxlength="24" minlength="24" required autocomplete="off" placeholder="24 خانة من الحروف والأرقام"><button type="submit">تحقق الآن</button></form><div id="result" role="status" aria-live="polite"></div></section></main><footer>أكاديمية اجتاز — نتائج وشهادات موثقة من النظام</footer><script>
const form=document.getElementById('check'),result=document.getElementById('result');function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n;}function row(lbl,val){const n=el('div');n.append(el('span',lbl),el('strong',String(val)));return n;}function stamp(x){if(!x)return'—';const d=new Date(String(x).replace(' ','T')+'Z');return Number.isFinite(+d)?d.toLocaleDateString('ar-EG'):'—';}
async function verify(code){result.replaceChildren(el('div','جارٍ التحقق من السجل الرسمي...','status'));try{const response=await fetch('./api/m7/verify?code='+encodeURIComponent(code),{credentials:'omit',cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error==='certificate_not_found'?'لم نجد شهادة مسجلة بهذا الرمز.':data.error==='invalid_certificate_code'?'صيغة رمز التحقق غير صحيحة.':'تعذر التحقق حاليًا.');const c=data.certificate,s=data.settings||{};if(/^#[0-9a-f]{6}$/i.test(s.primaryColor||''))document.documentElement.style.setProperty('--primary',s.primaryColor);if(/^#[0-9a-f]{6}$/i.test(s.accentColor||''))document.documentElement.style.setProperty('--accent',s.accentColor);const ok=c.status==='valid',box=el('div');box.append(el('div',ok?'✓ الشهادة أصلية وسارية':'✕ هذه الشهادة ملغاة ولا يمكن اعتمادها','status '+(ok?'ok':'bad')));const info=el('div',undefined,'info');info.append(row('المستفيد (اسم العرض)',c.recipientName),row('الإنجاز',c.sourceTitle),...(c.teamName?[row('الفريق',c.teamName)]:[]),row('نوع الإنجاز',c.sourceType==='challenge'?'تحدٍّ رسمي':'بطولة رسمية'),row('المركز',c.rank?String(c.rank):'شهادة إتمام'),row('تاريخ الإصدار',stamp(c.issuedAt)),row('رمز التحقق',c.code));box.append(info);result.replaceChildren(box);}catch(e){result.replaceChildren(el('div',e.message||'تعذر الاتصال بالخادم.','status bad'));}}
form.addEventListener('submit',e=>{e.preventDefault();const code=String(new FormData(form).get('code')||'').trim().toUpperCase();if(!/^[A-F0-9]{24}$/.test(code)){result.replaceChildren(el('div','رمز التحقق يجب أن يتكون من 24 خانة.','status bad'));return;}history.replaceState(null,'','?code='+encodeURIComponent(code));verify(code);});const q=new URLSearchParams(location.search).get('code');if(q&&/^[A-Fa-f0-9]{24}$/.test(q)){form.elements.code.value=q.toUpperCase();verify(q.toUpperCase());}
</script></body></html>
