</head><body class="academy-design academy-suite academy-suite-rest" data-academy-role="admin" data-academy-page="setup-admin"><a class="suite-auth-brand brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>التعلّم بخطوات واضحة</small></span></a><main class="setup"><section class="card"><span class="badge">إعداد لمرة واحدة</span><h1>إنشاء أول مدير للأكاديمية</h1><p class="muted">هذه الصفحة تعمل فقط عندما لا يوجد أي حساب مدير في قاعدة Hostinger. بعد إنشاء أول مدير تُغلق عملية التهيئة تلقائيًا.</p><form id="setupForm" class="form"><label class="suite-field"><span>اسم المدير</span><input id="name" required minlength="2" placeholder="اسم المدير"></label><label class="suite-field"><span>البريد الإلكتروني</span><input id="email" required type="email" placeholder="البريد الإلكتروني"></label><label class="suite-field"><span>كلمة المرور</span><input id="password" required type="password" minlength="8" placeholder="كلمة مرور قوية - 8 أحرف على الأقل"></label><button id="submit" type="submit">إنشاء حساب الإدارة</button></form><div id="status" class="status" role="status" aria-live="polite">جاري فحص قاعدة البيانات...</div><p class="muted"><a href="./admin.html">العودة إلى لوحة الإدارة</a></p></section></main><script src="./assets/student-design.js?v=20261010.2"></script>
<script src="./assets/academy-suite.js?v=20261010.5"></script>
<script src="./assets/backend-config.js?v=20261004.4"></script><script src="./assets/hostinger-backend.js?v=20261010.2"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),form=$('setupForm'),status=$('status');async function check(){try{const r=await AcademyBackend.request('setup/status');if(!r.needsAdmin){form.hidden=true;status.className='status ok';status.textContent='تم إنشاء مدير بالفعل. عملية التهيئة مغلقة ويمكنك تسجيل الدخول من لوحة الإدارة.'}else{status.textContent='القاعدة جاهزة. أنشئ أول حساب مدير الآن.'}}catch(e){form.hidden=true;status.className='status bad';status.textContent='تعذر الاتصال بقاعدة Hostinger. افتح /api/health أولًا وتأكد من إعداد قاعدة البيانات.'}}form.onsubmit=async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;status.textContent='جاري إنشاء المدير...';try{await AcademyBackend.request('setup/admin',{method:'POST',body:{displayName:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value}});form.hidden=true;status.className='status ok';status.innerHTML='تم إنشاء أول مدير بنجاح ✅ <a href="./admin.html">افتح لوحة الإدارة وسجّل الدخول</a>.'}catch(err){status.className='status bad';status.textContent=err.code==='auth/email-already-in-use'?'البريد مستخدم بالفعل.':'تعذر إنشاء المدير. تأكد من البيانات واتصال القاعدة.'}finally{btn.disabled=false}};check()})();
</script></body></html>
