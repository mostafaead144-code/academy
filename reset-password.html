</head><body class="academy-design academy-suite academy-suite-rest" data-academy-role="public" data-academy-page="reset-password"><a class="suite-auth-brand brand" href="./index.html"><span class="brand-mark"><i class="fa-solid fa-book-open"></i></span><span><strong>الأكاديمية</strong><small>التعلّم بخطوات واضحة</small></span></a><main class="wrap"><section class="card"><h1>تعيين كلمة مرور جديدة</h1><p>اكتب كلمة المرور الجديدة لحسابك.</p><form id="form"><label class="suite-field" for="password"><span>كلمة المرور الجديدة</span><input id="password" type="password" minlength="6" required placeholder="كلمة المرور الجديدة"></label><button>حفظ كلمة المرور</button></form><div id="status" class="status"></div></section></main><script src="./assets/student-design.js?v=20261010.2"></script>
<script src="./assets/academy-suite.js?v=20261010.5"></script>
<script src="./assets/backend-config.js?v=20261004.4"></script><script src="./assets/hostinger-backend.js?v=20261010.2"></script><script>(()=>{const token=new URLSearchParams(location.search).get('token')||'',f=document.getElementById('form'),s=document.getElementById('status');if(!token){f.hidden=true;s.textContent='الرابط غير صالح.';return}f.onsubmit=async e=>{e.preventDefault();try{await AcademyBackend.request('auth/password-reset',{method:'POST',body:{token,newPassword:document.getElementById('password').value}});f.hidden=true;s.innerHTML='تم تغيير كلمة المرور بنجاح. <a href="./index.html">العودة للأكاديمية</a>'}catch(err){s.textContent='تعذر تغيير كلمة المرور. قد يكون الرابط منتهي الصلاحية.'}}})();</script></body></html>
